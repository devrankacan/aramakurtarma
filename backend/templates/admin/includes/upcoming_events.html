<div class="module dash-module" id="upcoming-events-module">
    <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        Yaklaşan Faaliyetler
    </h2>
    {% if events %}
    <ul class="actionlist">
        {% for event in events %}
        <li>
            <a href="{% url 'admin:calendar_app_event_change' event.pk %}">{{ event.title }}</a>
            <br>
            <span class="mini quiet">
                {{ event.start_at|date:"d.m.Y H:i" }}{% if event.location %} · {{ event.location }}{% endif %}
            </span>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="dash-empty">Yaklaşan faaliyet yok.</p>
    {% endif %}
</div>
